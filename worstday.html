    card.vx *= Math.exp(-7 * dt); card.vy *= Math.exp(-7 * dt); card.vr *= Math.exp(-6 * dt);
    card.ox += card.vx * dt; card.oy += card.vy * dt; card.rot += card.vr * dt;
    card.pop += (1 - card.pop) * Math.min(1, dt * 9);
    // cool the fire heat slowly so patches that are not burnt through recover a bit
    for (let i = 0; i < heat.length; i++) if (!burnt[i] && heat[i] > 0) heat[i] = Math.max(0, heat[i] - dt * 0.05);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#5765F2'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0.01) { ctx.translate(rand(-1, 1) * shake * 14, rand(-1, 1) * shake * 14); shake *= Math.exp(-dt * 6); }
    ctx.drawImage(BG, 0, 0, W, H);

    let feed = 0;
    if (shredding) { shredding.t += dt; const f = clamp(shredding.t / shredding.dur, 0, 1); feed = f * (card.h + card.w * 0.12); if (f >= 1) finishShred(); }
    const s = 0.6 + 0.4 * card.pop, cw = card.w * s, chh = card.h * s;
    const cx = card.x + card.ox, cy = card.y + card.oy + feed;
    if (!machineDone) {
      ctx.save(); ctx.globalAlpha = 0.2; ctx.fillStyle = '#080808';
      ctx.beginPath(); ctx.ellipse(card.x, card.y + card.h / 2 + 16, card.w * 0.55, 10, 0, 0, TAU); ctx.fill(); ctx.restore();
    }
    ctx.save();
    if (shredding) { ctx.beginPath(); ctx.rect(0, 0, W, card.y + card.h / 2 + card.w * 0.08); ctx.clip(); }
    ctx.translate(cx, cy); ctx.rotate(card.rot); ctx.drawImage(A, -cw / 2, -chh / 2, cw, chh);
    ctx.restore();
    if (shredding) {
      const slotY = card.y + card.h / 2 + card.w * 0.08, mb = slotY + card.w * 0.2, k = kScale(), n = shredding.n, sw = TW / n;
      const passed = clamp((cy + card.h / 2 - slotY) / k, 0, TH);
      for (let i = 0; i < n; i++) ctx.drawImage(A, i * sw, TH - passed, sw, passed, left() + i * sw * k + (i - n / 2) * 3 + Math.sin(shredding.t * 6 + i) * 3, mb, sw * k, passed * k);
    }
    if (shredding || machineDone) drawShredder();

    for (const p of pieces) {
      p.t += dt;
      if (!p.landed) {
        const drag = p.strip ? 1.2 : 2.2;
        p.vx *= Math.exp(-drag * dt); p.vy = p.vy * Math.exp(-drag * dt) + 560 * dt;
        p.vx += Math.sin(p.t * p.fs) * p.fa * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.av * dt; p.av *= Math.exp(-1.0 * dt); p.flip += p.fv * dt;
        if (p.x < -40) { p.x = -40; p.vx = Math.abs(p.vx) * 0.4; }
        if (p.x > W + 40) { p.x = W + 40; p.vx = -Math.abs(p.vx) * 0.4; }
        if (p.y > H - 8 - p.rest) { p.y = H - 8 - p.rest; p.vy = 0; p.landed = true; if (p.strip) p.rot = (Math.random() < 0.5 ? 1 : -1) * Math.PI / 2 + rand(-0.3, 0.3); p.flip = Math.round(p.flip / Math.PI) * Math.PI; }
      }
      const fxv = Math.cos(p.flip), img = fxv >= 0 ? p.c : p.back;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.scale(p.k * Math.max(0.12, Math.abs(fxv)) * (fxv >= 0 ? 1 : -1), p.k);
      ctx.drawImage(img, -p.w / 2, -p.h / 2); ctx.restore();
    }
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i]; b.t += dt;
      const f = clamp(b.t / b.dur, 0, 1), sc = (b.mega ? 1.8 : 1) * (1 + (1 - f) * 2.2);
      ctx.save(); ctx.globalAlpha = 0.25 * f; ctx.fillStyle = '#080808'; ctx.beginPath(); ctx.ellipse(b.x, b.y + 18, 22 * f * (b.mega ? 1.8 : 1), 7 * f, 0, 0, TAU); ctx.fill(); ctx.restore();
      drawBombSprite(b.x, b.y - (1 - f) * 40, sc, b.spin * (1 - f) * 2, b.t);
      if (f >= 1) { bombs.splice(i, 1); explode(b.x, b.y, b.mega); }
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const g = rings[i]; g.t += dt; const k = g.t / g.dur, e = 1 - Math.pow(1 - k, 3);
      if (k >= 1) { rings.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(255,214,51,${(1 - k) * 0.9})`; ctx.lineWidth = 10 * (1 - k) + 2;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.R * e, 0, TAU); ctx.stroke();
      if (k < 0.4) { ctx.fillStyle = `rgba(255,190,90,${(0.4 - k) * 2})`; ctx.beginPath(); ctx.arc(g.x, g.y, g.R * 0.35 * (0.4 + e), 0, TAU); ctx.fill(); }
    }
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.life -= dt; if (d.life <= 0) { drops.splice(i, 1); continue; }
      d.vx *= Math.exp(-1.5 * dt); d.vy = d.vy * Math.exp(-1.5 * dt) + 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
      ctx.globalAlpha = Math.min(1, d.life * 2); ctx.fillStyle = d.col; ctx.beginPath(); ctx.arc(d.x, d.y, d.size, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    }
    for (let i = smoke.length - 1; i >= 0; i--) {
      const sm = smoke[i]; sm.life -= dt; if (sm.life <= 0) { smoke.splice(i, 1); continue; }
      sm.vx *= Math.exp(-2 * dt); sm.vy = sm.vy * Math.exp(-2 * dt) - 30 * dt; sm.x += sm.vx * dt; sm.y += sm.vy * dt; sm.size += 26 * dt;
      ctx.fillStyle = `rgba(40,36,60,${(sm.life / sm.max) * 0.35})`; ctx.beginPath(); ctx.arc(sm.x, sm.y, sm.size, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i]; sp.life -= dt; if (sp.life <= 0) { sparks.splice(i, 1); continue; }
      sp.vx *= Math.exp(-2.5 * dt); sp.vy = sp.vy * Math.exp(-2.5 * dt) + sp.g * dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt;
      ctx.fillStyle = `hsla(${sp.hue},100%,60%,${sp.life / sp.max})`; ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.size * (sp.life / sp.max + 0.3), 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    if (flash > 0.01) { ctx.fillStyle = `rgba(255,240,200,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); flash *= Math.exp(-dt * 9); }
    if (firing) { fireHold += dt; if (fireHold > 0.06 && lastFire) { fireHold = 0; burnAt(lastFire[0], lastFire[1]); } }
  }

  resize();
  source = new Image();
  source.onload = () => { paintCard(); };
  source.src = CARD_SRC;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
