<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wack MyGuyVR</title>

<meta property="og:type" content="website">
<meta property="og:site_name" content="Wack MyGuyVR">

<meta property="og:url" content="https://vocql.github.io/wackmyguyvr/">

<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wack MyGuyVR: MyGuyVR is having the worst day ever, and you’re the reason. Bomb him, burn him, shred him. Make it even worse.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Wack MyGuyVR">
<meta name="twitter:image" content="https://vocql.github.io/wackmyguyvr/og-image.png?v=5">

<link rel="stylesheet" href="menu.css">
<style>
html,body{margin:0;height:100%;background:#5765F2}
.pill{display:inline-block;margin-top:clamp(16px,2.4vh,26px);font-family:'Lilita One','Arial Black',sans-serif;letter-spacing:.08em;font-size:clamp(18px,1.4vw,26px);color:#080808;background:#FFD633;border:4px solid #080808;border-radius:999px;padding:2px 18px 0;box-shadow:0 5px 0 #080808;transform:rotate(-2deg)}
.mbtn.demo{--c:var(--sky);width:92%}
.mbtn.demo:hover:not(:disabled) .mbtn-icon{transform:rotate(-20deg) scale(1.12)}
.menu.intro .mbtn.demo{animation-delay:.47s}
@media (max-width:900px){.mbtn.demo{width:100%}</style>
</head>
<body>
<div id="menu" class="menu intro" role="region" aria-label="Main menu">
  <div class="menu-bg" id="menu-bg" aria-hidden="true"></div>
  <div class="menu-scroll">
    <main class="menu-stage">
      <div class="menu-brand">
        <h1 class="logo" aria-label="Wack MyGuyVR">
          <span class="logo-wack" aria-hidden="true"><span style="--i:0">W</span><span style="--i:1">A</span><span style="--i:2">C</span><span style="--i:3">K</span></span>
          <span class="logo-sub" aria-hidden="true">MyGuyVR</span>
        </h1>
        <span class="pill" id="m-pill">OUT NOW</span>
        <p class="tagline">Build a buddy, then test every gadget in the box on him. Physics does the rest.</p>
      </div>

      <div class="menu-mascot">
        <div class="bubble" id="m-bubble" aria-live="polite">Ready when you are!</div>
        <svg class="mascot" id="mascot" viewBox="0 0 600 620" role="img" aria-label="Wack, the cool yellow duck mascot in sunglasses">
          <defs>
            <clipPath id="lensL"><circle cx="290" cy="188" r="19"/></clipPath>
            <clipPath id="lensR"><circle cx="336" cy="185" r="16"/></clipPath>
            <clipPath id="eyeClipL"><circle cx="290" cy="188" r="15"/></clipPath>
            <clipPath id="eyeClipR"><circle cx="336" cy="185" r="12.5"/></clipPath>
          </defs>
          <g class="m-bob">
            <!-- blue top -->
            <path d="M34 586 C44 500 108 404 188 392 C246 384 292 414 330 428 L462 448 C526 456 574 520 588 586 C592 606 572 618 546 618 L76 618 C50 618 30 606 34 586 Z" fill="#4099F0"/>
            <g fill="none" stroke-linecap="round">
              <path d="M352 500 C338 556 348 600 378 616" stroke="#FFFFFF" stroke-width="6"/>
              <path d="M446 506 C458 556 446 596 420 614" stroke="#FFFFFF" stroke-width="6"/>
              <path d="M150 584 L276 598" stroke="#080808" stroke-width="12"/>
              <path d="M214 586 L226 556" stroke="#080808" stroke-width="12"/>
              <path d="M520 548 L506 604" stroke="#080808" stroke-width="12"/>
              <path d="M494 600 L536 572" stroke="#5765F2" stroke-width="8"/>
            </g>
            <g class="m-sway">
              <!-- antenna hair -->
              <g class="m-hair" fill="none" stroke="#FF8B18" stroke-width="12" stroke-linecap="round">
                <path class="t1" d="M157 80 C190 100 230 88 268 92 C290 96 302 114 297 138"/>
                <path class="t2" d="M252 66 C274 72 302 96 313 132"/>
              </g>
              <!-- head + long neck + scalloped chest -->
              <path d="M196 130 C210 108 250 100 285 108 C305 112 318 130 322 150 L330 200 C346 250 372 286 410 330 L472 346 L452 360 C480 400 492 440 490 480 C488 505 470 520 455 515 C445 530 425 532 412 522 C400 535 378 535 368 522 C355 532 335 528 325 515 C305 510 292 498 295 480 L300 462 L280 452 L304 432 C290 400 246 332 215 285 L176 270 L204 254 L157 238 L194 222 C184 190 185 150 196 130 Z" fill="#FFD633"/>
              <!-- feather marks -->
              <g fill="none" stroke="#FF8B18" stroke-linecap="round" opacity=".75">
                <path d="M414 331 L440 345" stroke-width="10"/>
                <path d="M318 428 C312 450 330 456 340 445 C346 460 360 458 363 448 C372 458 386 452 386 440" stroke-width="9"/>
              </g>
              <!-- eyes behind the shades (peek on hover) -->
              <g class="m-eye">
                <circle cx="290" cy="188" r="15" fill="#FFFFFF"/>
                <g clip-path="url(#eyeClipL)">
                  <g class="m-pupil" data-cx="290" data-cy="188" data-max="5"><circle cx="292" cy="189" r="7" fill="#080808"/><circle cx="294.5" cy="186" r="2.2" fill="#FFFFFF"/></g>
                  <rect class="m-lid" x="270" y="170" width="40" height="38" fill="#FFD633"/>
                </g>
              </g>
              <g class="m-eye">
                <circle cx="336" cy="185" r="12.5" fill="#FFFFFF"/>
                <g clip-path="url(#eyeClipR)">
                  <g class="m-pupil" data-cx="336" data-cy="185" data-max="4"><circle cx="338" cy="186" r="6" fill="#080808"/><circle cx="340" cy="183.5" r="1.9" fill="#FFFFFF"/></g>
                  <rect class="m-lid" x="320" y="170" width="34" height="32" fill="#FFD633"/>
                </g>
              </g>
              <!-- round sunglasses -->
              <g class="m-shades">
                <path d="M271 186 L248 183" stroke="#080808" stroke-width="5" stroke-linecap="round"/>
                <path d="M308 187 L321 186" stroke="#080808" stroke-width="5" stroke-linecap="round"/>
                <circle cx="290" cy="188" r="19" fill="#080808"/>
                <circle cx="336" cy="185" r="16" fill="#080808"/>
                <g class="m-glint" fill="#4a5cf0">
                  <g clip-path="url(#lensL)"><path d="M268 196 L294 168 L303 174 L277 202 Z"/><path d="M284 210 L310 182 L314 190 L290 214 Z"/></g>
                  <g clip-path="url(#lensR)"><path d="M318 192 L340 168 L348 173 L326 197 Z"/><path d="M332 204 L354 180 L357 187 L337 207 Z"/></g>
                </g>
              </g>
              <!-- big pink bill -->
              <g class="m-mouth">
                <path d="M285 207 C300 192 330 194 360 197 C395 193 425 179 445 187 C463 195 459 222 441 232 C456 245 449 263 425 263 C395 263 370 251 340 256 C310 263 284 246 285 226 Z" fill="#EB469F"/>
                <g fill="none" stroke="#080808" stroke-width="6" stroke-linecap="round">
                  <path d="M398 232 Q412 238 424 216"/>
                  <path d="M410 235 L408 248"/>
                </g>
              </g>
            </g>
          </g>
        </svg>
      </div>

      <nav class="menu-buttons" aria-label="Main menu">
        <button class="mbtn start" id="m-download" type="button">
          <span class="mbtn-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><g fill="none" stroke="#080808" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 20h14"/></g></svg></span>
          <span class="mbtn-text"><span class="mbtn-label">DOWNLOAD</span><span class="mbtn-sub" id="m-dl-sub">Get the Windows game</span></span>
        </button>
        <button class="mbtn demo" id="m-demo" type="button">
          <span class="mbtn-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="#080808" stroke="#080808" stroke-width="2" stroke-linejoin="round"/></svg></span>
          <span class="mbtn-text"><span class="mbtn-label">PLAY DEMO</span><span class="mbtn-sub">Free, right in your browser</span></span>
        </button>
      </nav>
    </main>
    <p class="menu-note" id="m-note"></p>
  </div>
</div>
<script src="menu-soon.js"></script>
</body>
</html>
